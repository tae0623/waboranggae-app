name: waboranggae-team
services:
  db:
    image: postgres:15
    # Retired PC team server: preserve data, but do not restart it with Docker.
    restart: "no"
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_USER: waboranggae_dev
      POSTGRES_PASSWORD: ${TEAM_DB_PASSWORD:?Run pnpm team:setup first}
      POSTGRES_DB: waboranggae_dev
    volumes:
      - team_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waboranggae_dev -d waboranggae_dev"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  team_pgdata:
